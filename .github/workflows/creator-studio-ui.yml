name: Image Factory UI checks

on:
  pull_request:
    paths:
      - "views/**"
      - "public/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/creator-studio-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test application and templates without production DB
        run: npm run test:unit
      - name: Verify route and SQL contracts
        run: npm run test:contract
      - name: Check obsolete mint links
        run: npm run check:mint
